<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="os-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B19" />
      <stop offset="55%" stop-color="#0F2B5C" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Ring Primary Gradient -->
    <linearGradient id="os-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#93C5FD" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Core Dynamic Chevron Gradient -->
    <linearGradient id="os-chevron" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- AI Spark Gradient -->
    <linearGradient id="os-spark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#67E8F9" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="os-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with Sleek Modern Border -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#os-bg)" />
  <rect x="20" y="20" width="472" height="472" rx="112" stroke="rgba(255,255,255,0.2)" stroke-width="4" />

  <!-- Ambient Backdrop Glow -->
  <circle cx="256" cy="256" r="160" fill="#2563EB" opacity="0.4" filter="url(#os-glow)" />
  <circle cx="340" cy="170" r="80" fill="#38BDF8" opacity="0.3" filter="url(#os-glow)" />

  <!-- Geometric / Athletic "O" Ring -->
  <path
    d="M 256 88 C 349.88 88 426 164.12 426 258 C 426 351.88 349.88 428 256 428 C 162.12 428 86 351.88 86 258 C 86 164.12 162.12 88 256 88 Z M 256 146 C 194.14 146 144 196.14 144 258 C 144 319.86 194.14 370 256 370 C 317.86 370 368 319.86 368 258 C 368 196.14 317.86 146 256 146 Z"
    fill="url(#os-ring)"
  />

  <!-- Dynamic Center Athletic Chevron / "A" for AI -->
  <path
    d="M 256 172 L 314 286 L 276 286 L 256 242 L 236 286 L 198 286 Z"
    fill="#FFFFFF"
  />
  <path
    d="M 256 266 L 298 344 L 270 344 L 256 312 L 242 344 L 214 344 Z"
    fill="url(#os-chevron)"
  />

  <!-- AI Spark / Intelligence Star (Top-Right) -->
  <path
    d="M 374 96 Q 374 136 414 136 Q 374 136 374 176 Q 374 136 334 136 Q 374 136 374 96 Z"
    fill="url(#os-spark)"
  />

  <!-- Core Intelligence Spark Center Point -->
  <circle cx="374" cy="136" r="6" fill="#FFFFFF" />
</svg>
